name: Resume approved signing requests

on:
  workflow_dispatch:
    inputs:
      phase:
        type: choice
        options: [prepare-setup, finalize-setup]
        required: true
      source_commit:
        description: Exact 40-character commit from the original signing receipt
        required: true
        type: string
      source_run_id:
        description: Original Windows build run; for finalization, the setup-submission run
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  resume:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-2022
    environment: code-signing
    timeout-minutes: 45
    env:
      SOURCE_CHECKOUT_SHA: ${{ inputs.source_commit }}
      SOURCE_RUN_ID: ${{ inputs.source_run_id }}
      SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
      SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
      SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
      SIGNPATH_APP_CONFIGURATION: ${{ vars.SIGNPATH_APP_CONFIGURATION }}
      SIGNPATH_UNINSTALLER_CONFIGURATION: ${{ vars.SIGNPATH_UNINSTALLER_CONFIGURATION }}
      SIGNPATH_SETUP_CONFIGURATION: ${{ vars.SIGNPATH_SETUP_CONFIGURATION }}
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
    steps:
      - name: Validate identifiers before checking out or using secrets
        shell: pwsh
        run: |
          if ($env:SOURCE_CHECKOUT_SHA -cnotmatch '^[a-f0-9]{40}$') { throw 'Exact source commit is required' }
          if ($env:SOURCE_RUN_ID -notmatch '^[1-9][0-9]*$') { throw 'Exact prior run ID is required' }
          if ($env:SOURCE_CHECKOUT_SHA -cne $env:GITHUB_SHA) { throw 'Main advanced; start a new source/signing run' }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require the actual checkout to match an ancestor of main
        shell: pwsh
        run: |
          if ((git rev-parse HEAD).Trim() -cne $env:SOURCE_CHECKOUT_SHA) { throw 'Checkout commit mismatch' }
          git merge-base --is-ancestor HEAD origin/main
          if ($LASTEXITCODE -ne 0) { throw 'Signing source must belong to main history' }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13.15'
          architecture: x64
      - run: python -m pip install -r requirements-build-lock.txt
      - name: Require real configured SignPath values
        run: python -B -m ci.signpath config
      - name: Download receipt from the exact submission run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signing-requests
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
          path: .ci-input/receipt
      - name: Download original unsigned build evidence
        if: inputs.phase == 'prepare-setup'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unsigned-beta7-preparation
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
          path: .ci-input/unsigned
      - name: Require completed, origin-bound app/uninstaller; build deferred Setup
        if: inputs.phase == 'prepare-setup'
        run: python -B -m ci.resume_signing prepare-setup --unsigned .ci-input/unsigned --receipt .ci-input/receipt/signing-requests.json --output-root .ci-work/beta7-preparation
      - name: Store verified inner inputs and unsigned Setup (not a final release)
        if: inputs.phase == 'prepare-setup'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: setup-signing-stage
          path: .ci-work/beta7-preparation/artifacts/*
          if-no-files-found: error
          retention-days: 14
      - name: Upload only the own Setup for signing
        if: inputs.phase == 'prepare-setup'
        id: setup_input
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: setup-signing-input
          path: .ci-work/beta7-preparation/artifacts/WoGStorageHelperSetup.exe
          if-no-files-found: error
          retention-days: 14
      - name: Submit Setup asynchronously after the signed inner components are embedded
        if: inputs.phase == 'prepare-setup'
        id: setup
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_SETUP_CONFIGURATION }}
          github-artifact-id: ${{ steps.setup_input.outputs.artifact-id }}
          wait-for-completion: 'false'
      - name: Preserve actual pending Setup request
        if: always() && steps.setup.outputs.signing-request-id != ''
        env:
          SIGNPATH_SETUP_REQUEST: ${{ steps.setup.outputs.signing-request-id }}
        run: python -B -m ci.signpath receipt --output signing-requests.json
      - name: Upload pending request receipt
        if: always() && steps.setup.outputs.signing-request-id != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signing-requests
          path: signing-requests.json
          if-no-files-found: error
          retention-days: 14
      - name: Download deferred Setup stage
        if: inputs.phase == 'finalize-setup'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: setup-signing-stage
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
          path: .ci-input/setup
      - name: Verify all three trusted signatures, timestamp, identities and embedded hashes
        if: inputs.phase == 'finalize-setup'
        run: python -B -m ci.resume_signing finalize-setup --stage .ci-input/setup --receipt .ci-input/receipt/signing-requests.json --output-root .ci-work/beta7-preparation
      - name: Store final verified signed evidence for a separate release review
        if: inputs.phase == 'finalize-setup'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-signed-beta7-not-published
          path: .ci-work/beta7-preparation/*
          if-no-files-found: error
          retention-days: 14
